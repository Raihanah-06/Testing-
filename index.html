
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Adventure Tahun 5</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #eef6ff;
  padding: 20px;
}
main {
  max-width: 450px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 20px;
}
button {
  padding: 12px 18px;
  margin: 6px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
#feedback { font-weight: bold; }
</style>
</head>
<body>
<main>
  <h1>🏝️ Math Adventure</h1>
  <p>Tahun 5 · Kumpul bintang!</p>

  <label for="level">Pilih tahap:</label>
  <select id="level" onchange="startGame()">
    <option value="1">Level 1: Explorer</option>
    <option value="2">Level 2: Adventurer</option>
    <option value="3">Level 3: Math Master</option>
  </select>

  <h2 id="question"></h2>
  <div id="answers"></div>
  <p id="feedback" aria-live="polite"></p>
  <p>⭐ Bintang: <span id="score">0</span></p>
  <button onclick="startGame()">Soalan seterusnya ↻</button>
</main>

<script>
let score = 0;
let correctAnswer = 0;
let answered = false;

function startGame() {
  answered = false;
  document.getElementById("feedback").textContent = "";
  const level = Number(document.getElementById("level").value);
  let a, b, op;

  if (level === 1) {
    a = Math.floor(Math.random() * 100) + 1;
    b = Math.floor(Math.random() * 100) + 1;
    op = Math.random() < 0.5 ? "+" : "-";
    if (op === "-" && b > a) [a, b] = [b, a];
  } else if (level === 2) {
    op = Math.random() < 0.5 ? "×" : "÷";
    if (op === "×") {
      a = Math.floor(Math.random() * 12) + 1;
      b = Math.floor(Math.random() * 12) + 1;
    } else {
      b = Math.floor(Math.random() * 12) + 1;
      a = b * (Math.floor(Math.random() * 12) + 1);
    }
  } else {
    a = Math.floor(Math.random() * 20) + 2;
    b = Math.floor(Math.random() * 10) + 1;
    op = Math.random() < 0.5 ? "+" : "×";
  }

  correctAnswer = op === "+" ? a + b :
    op === "-" ? a - b :
    op === "×" ? a * b : a / b;

  document.getElementById("question").textContent =
    `Berapakah ${a} ${op} ${b}?`;

  let choices = new Set([correctAnswer]);
  while (choices.size < 4) {
    let wrong = correctAnswer +
      (Math.floor(Math.random() * 11) - 5) *
      (level === 2 ? 2 : 1);
    if (Number.isFinite(wrong) && wrong >= 0 &&
        wrong !== correctAnswer) choices.add(wrong);
  }

  const box = document.getElementById("answers");
  box.replaceChildren();

  [...choices].sort(() => Math.random() - 0.5)
    .forEach(answer => {
      const btn = document.createElement("button");
      btn.textContent = answer;
      btn.onclick = () => checkAnswer(answer);
      box.appendChild(btn);
    });
}

function checkAnswer(answer) {
  if (answered) return;
  answered = true;

  if (answer === correctAnswer) {
    score++;
    document.getElementById("feedback").textContent =
      "Betul! Hebat! 🎉";
  } else {
    document.getElementById("feedback").textContent =
      `Belum tepat. Jawapan ialah ${correctAnswer}.`;
  }

  document.getElementById("score").textContent = score;
}

startGame();
</script>
</body>
</html>
